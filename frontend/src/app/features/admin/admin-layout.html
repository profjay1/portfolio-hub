<a class="skip-link" href="#main">Skip to content</a>

<header class="admin-header">
  <div class="container admin-header-inner">
    <p class="admin-brand">Admin</p>

    <nav class="admin-nav" aria-label="Admin">
      <ul>
        @for (link of links; track link.path) {
          <li>
            <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{
              link.label
            }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="header-actions">
      <a class="view-site" routerLink="/">View site</a>
      @if (email(); as address) {
        <p class="signed-in">
          Signed in as <strong>{{ address }}</strong>
        </p>
      }
      <button type="button" class="button sign-out" [disabled]="signingOut()" (click)="signOut()">
        @if (signingOut()) {
          Signing out…
        } @else {
          Sign out
        }
      </button>
    </div>

    @if (signOutError(); as message) {
      <p class="notice notice-error sign-out-error" role="alert">{{ message }}</p>
    }
  </div>
</header>

<main id="main" class="container admin-main" tabindex="-1">
  <router-outlet />
</main>
