# Serves the Angular build and forwards /api to the backend, so the browser sees one origin: the same job
# proxy.conf.json does for `ng serve`. The session (__Host- cookie) and CSRF double-submit (XSRF-TOKEN cookie
# echoed as X-XSRF-TOKEN) only work same-origin, and the backend has no CORS configuration on purpose.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolving per request (proxy_pass with a variable, below) means nginx starts even
    # if the backend is not up yet, and follows the backend to a new IP when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        # With a variable and no URI part, nginx forwards the original request URI unchanged (no prefix rewrite),
        # matching the dev proxy.
        proxy_pass $backend;

        # Keep the browser's Host (including the port), as the dev proxy does (changeOrigin is false there). The
        # backend then sees the same origin the browser used, so anything it derives from the request URL
        # (redirects, Problem Details "instance") points back through this proxy, not at backend:8080.
        proxy_set_header Host $http_host;

        # X-Forwarded-* headers are deliberately not added: nginx passes through whatever an upstream proxy
        # (Caddy in production) sent. Which proxy the backend trusts for the client IP and scheme is decided in
        # #12 and #61; setting X-Forwarded-Proto here would overwrite Caddy's "https" with "http".

        # Set-Cookie and Cookie pass through untouched: the cookies carry no Domain attribute and use Path=/, so
        # no proxy_cookie_domain or proxy_cookie_path rewriting is needed or wanted.

        # nginx's 1m default would reject resume uploads; match spring.servlet.multipart.max-request-size (11MB).
        client_max_body_size 11m;
    }

    # Content-hashed build output (outputHashing in production) never changes under the same name.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
        try_files $uri =404;
        # One header: `expires` would add a second Cache-Control alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (e.g. /admin/login) fall back to the SPA shell, which must never be cached: it names the
    # current hashed bundles.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
