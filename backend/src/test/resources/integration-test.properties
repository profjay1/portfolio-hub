# Throwaway test-only values: admin credentials so every fresh test database can bootstrap, and a JWT signing secret.
# Mixed-case email on purpose: the stored address must come out normalised.
hub.admin.email=Admin@Example.TEST
hub.admin.password=integration-test-only-password
hub.jwt.secret=integration-test-only-signing-secret-0123456789
# Resume uploads go under Maven's build directory, so `mvn clean` removes them.
hub.resume.storage-path=target/resume-test-storage
