spring:
  application:
    name: hub
  servlet:
    multipart:
      # Slightly above the resume limit so the container rejects huge bodies early, while the resume module's own
      # check (hub.resume.max-size) gives the precise error for anything in between.
      max-file-size: 11MB
      max-request-size: 11MB

# Only health and info are reachable over HTTP; every other actuator endpoint stays unexposed (404).
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness exist outside Kubernetes too, for Compose and Caddy health gates.
      probes:
        enabled: true
      group:
        # Readiness includes the database so traffic stops while PostgreSQL is unreachable.
        # Liveness deliberately does not: a database outage should not make the platform restart the app.
        readiness:
          include: readinessState, db

hub:
  jwt:
    # The signing secret has no default: it comes only from HUB_JWT_SECRET.
    ttl: 1h
  resume:
    # No default: uploads must land on a directory the operator chose (and backs up). Mapped explicitly because
    # relaxed binding would read HUB_RESUME_STORAGE_PATH as hub.resume.storage.path.
    storage-path: ${HUB_RESUME_STORAGE_PATH}
    max-size: 10MB

logging:
  pattern:
    # Plain-text logs (local) show the request's correlation id; structured formats include MDC entries already.
    correlation: "[%X{correlationId:-}] "

---
# Developer machine against a locally running PostgreSQL (see .env.example).
# No fallback values: a missing variable fails startup instead of silently connecting somewhere else.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${HUB_DB_URL}
    username: ${HUB_DB_USER}
    password: ${HUB_DB_PASSWORD}

---
# Production: one JSON object per line (Elastic Common Schema) so logs can be shipped and queried by field.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
