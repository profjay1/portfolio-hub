spring:
  application:
    name: hub
  autoconfigure:
    # Boot's fallback in-memory user logs a generated password at startup. Nothing can use it (no Basic or form
    # login), but a credential in the logs is still a leak. Users come from the identity module instead (#24).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Only health and info are reachable over HTTP; every other actuator endpoint stays unexposed (404).
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness exist outside Kubernetes too, for Compose and Caddy health gates.
      probes:
        enabled: true
      group:
        # Readiness includes the database so traffic stops while PostgreSQL is unreachable.
        # Liveness deliberately does not: a database outage should not make the platform restart the app.
        readiness:
          include: readinessState, db

logging:
  pattern:
    # Plain-text logs (local) show the request's correlation id; structured formats include MDC entries already.
    correlation: "[%X{correlationId:-}] "

---
# Developer machine against a locally running PostgreSQL (see .env.example).
# No fallback values: a missing variable fails startup instead of silently connecting somewhere else.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${HUB_DB_URL}
    username: ${HUB_DB_USER}
    password: ${HUB_DB_PASSWORD}

---
# Production: one JSON object per line (Elastic Common Schema) so logs can be shipped and queried by field.
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
