---
# The non-root sudo user that owns the server and runs the stack.
hub_deploy_user: deploy
# Public key installed for that user, read from the controller. A path, so the key (and its comment) stays out of
# the repo.
hub_deploy_ssh_public_key_file: "{{ lookup('ansible.builtin.env', 'HUB_SSH_PUBLIC_KEY_FILE') }}"
