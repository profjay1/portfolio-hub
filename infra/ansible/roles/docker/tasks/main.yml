---
# Reproduces what get.docker.com set up: the same keyring path, the same .list file name and the same single line,
# so apt never sees the repository twice and a re-run finds nothing to change.
- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# With a checksum, get_url compares the existing file and downloads nothing when it already matches.
- name: Install Docker's apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "{{ docker_apt_key_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker's apt repository
  ansible.builtin.copy:
    content: >
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_source

# Not version-pinned: "present" never upgrades, and unattended-upgrades only takes Ubuntu's security pocket, so
# Docker moves only when someone runs the opt-in "upgrade" tag (base role).
# The cache is refreshed only when the repository was just added, so apt can see the Docker packages on a fresh server.
- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_apt_source is changed }}"

- name: Keep Docker enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

# Membership of the docker group is root-equivalent on this host; it is granted to the one admin user only.
- name: Let the deploy user run Docker without sudo
  ansible.builtin.user:
    name: "{{ hub_deploy_user }}"
    groups: [docker]
    append: true
