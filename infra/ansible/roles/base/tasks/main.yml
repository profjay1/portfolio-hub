---
# Refreshing the package index is not a configuration change, so it never counts as one.
- name: Refresh the apt cache when it is older than a day
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
  changed_when: false

# Opt-in only (tag "never"): upgrading packages is a deliberate maintenance step, not part of a routine run.
- name: Apply pending package upgrades
  ansible.builtin.apt:
    upgrade: safe
  tags: [never, upgrade]

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# Line by line rather than templating the whole file, so this asserts the two settings without rewriting
# anything else the package or debconf put there.
- name: Enable daily package list updates and unattended security upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    regexp: "^{{ item.key | regex_escape }} "
    line: '{{ item.key }} "{{ item.value }}";'
    owner: root
    group: root
    mode: "0644"
    create: true
  loop:
    - { key: "APT::Periodic::Update-Package-Lists", value: "1" }
    - { key: "APT::Periodic::Unattended-Upgrade", value: "1" }
  loop_control:
    label: "{{ item.key }}"

- name: Keep the unattended-upgrades service enabled and running
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Keep the apt timers that drive unattended upgrades enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
