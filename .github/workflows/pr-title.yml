name: PR title

# Runs on pull_request_target because it only reads the PR title and never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # PRs are squash-merged, so the PR title becomes the commit on main. It must be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject must not start with an uppercase letter.
