name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which parts of the monorepo changed, so we only run relevant jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      backend-present: ${{ steps.manifests.outputs.backend-present }}
      frontend-present: ${{ steps.manifests.outputs.frontend-present }}
    steps:
      - uses: actions/checkout@v4
      # 'every' means a file counts only if it matches ALL patterns in a filter, which is what lets the
      # '!**/*.md' exclusions work: a CLAUDE.md edit under backend/ or frontend/ does not start a build.
      # The workflow file therefore needs its own filter rather than sharing a list with the negations.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            ci:
              - '.github/workflows/ci.yml'
      # Until M1 adds the code, backend/ and frontend/ hold only docs, so a build would fail on a missing
      # wrapper or package.json. Once M1 lands, drop this guard so a deleted manifest fails loudly.
      - name: Detect build manifests
        id: manifests
        run: |
          echo "backend-present=$([[ -f backend/mvnw ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend-present=$([[ -f frontend/package.json ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (build, test)
    needs: changes
    if: needs.changes.outputs.backend-present == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on the runner.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (lint, test, build)
    needs: changes
    if: needs.changes.outputs.frontend-present == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  # Single, always-running required check. Branch protection requires ONLY this job, which avoids the
  # classic "required check never reports because its path filter skipped it" deadlock.
  gate:
    name: CI Gate
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
