name: Feature (vertical slice)
description: A user-visible or operator-visible capability, small enough for one PR
labels: ["type:feature"]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: identity, projects, resume, contact, notifications, insights, frontend, infra, docs
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a recruiter, I want to ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements, one per line (Given/When/Then is welcome)
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: nfr
    attributes:
      label: Security, privacy and operational notes
  - type: checkboxes
    id: learning
    attributes:
      label: Learning mode
      options:
        - label: hand-write (the owner implements; Claude provides spec, tests, and review)
